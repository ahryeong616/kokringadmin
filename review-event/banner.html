<!--
  ============================================================================
  이젠오토(EGEN AUTO) 리뷰 이벤트 - 상세페이지 최상단 배너
  ============================================================================
  · 디자인 방향 : 흰 배경 + 중앙 정렬 + 대형 타이포 + 점선 구분 + 번호 안내.
                  컬러는 최소한으로만 쓰고(브랜드 블루 / 별 골드) 나머지는
                  무채색으로 눌러 정보가 먼저 읽히게 한다.
  · 출력 규격   : 가로 860px로 조판하고 렌더링 시 2배(1720px)로 캡처한다.
  · 렌더 방법   : 같은 폴더의 build.sh 실행 (헤드리스 Chrome 스크린샷)
  · 폰트        : Pretendard (build.sh가 시스템에 설치한 뒤 렌더링)
  · 이미지      : assets/logo_trim.png  - 로고 원본에서 여백만 잘라낸 것
                  assets/model_face.png - 모델 시트에서 얼굴이 정중앙에 오도록
                                          정사각으로 잘라낸 것 (원형 배지용)
                  → 두 파일 모두 build.sh가 원본에서 자동 생성한다.

  [수정 가이드]
  · 금액/문구만 바꿀 때는 아래 <body> 영역의 텍스트만 고치면 된다.
  · 큰 글씨에는 white-space:nowrap이 걸려 있어 줄바꿈 없이 옆으로 삐져나간다.
    문구를 길게 바꿨다면 build.sh의 "레이아웃 검증" 출력에서 !!넘침 경고가
    뜨는지 반드시 확인할 것. 본문 가용 폭은 720px(860 - 좌우 여백 70×2)이다.
  ============================================================================
-->
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* 페이지 바깥은 마젠타로 칠해 둔다.
   렌더링 후 "마젠타가 아닌 영역"만 잘라내면 배너 크기에 딱 맞게 재단된다. */
html,body{background:#FF00FF}

/* ── 배너 본체 ───────────────────────────────────────────────────────────── */
.page{
  width:860px;                       /* 상세페이지 표준 폭 */
  background:#fff;
  font-family:Pretendard,sans-serif;
  color:#14212E;
  -webkit-font-smoothing:antialiased;
  padding:56px 70px 54px;            /* 좌우 70px → 본문 가용 폭 720px */
  text-align:center;                 /* 전체 중앙 정렬이 이 디자인의 기본 골격 */
}

/* ── 1) 상단 : 모델 원형 배지 + 로고 + 채널 라벨 ─────────────────────────── */
/*    모델은 얼굴만 원형으로 작게 넣어 시선을 끌되 카피를 가리지 않게 한다. */
.face{
  width:112px;height:112px;border-radius:50%;
  object-fit:cover;object-position:50% 42%;   /* 얼굴이 원 중앙에 오도록 미세 조정 */
  border:5px solid #EEF4F9;                   /* 흰 배경과 분리해 주는 연한 링 */
  display:block;margin:0 auto;
}
.logo{height:24px;display:block;margin:20px auto 0}
.sub{margin-top:20px;font-size:13px;font-weight:700;letter-spacing:3px;color:#8B9AA8}

/* ── 2) 제목 블록 ────────────────────────────────────────────────────────── */
/*    text-indent는 letter-spacing 때문에 마지막 글자 뒤에 붙는 여백을 상쇄해
      별 5개가 정확히 가운데 오도록 보정하는 값이다. */
.stars{margin-top:18px;font-size:25px;letter-spacing:9px;color:#FFC93C;text-indent:9px}
.t1{margin-top:20px;font-size:33px;font-weight:700;color:#2C3A47;white-space:nowrap}
.t2{margin-top:2px;font-size:62px;font-weight:900;color:#1668B0;letter-spacing:-2.5px;white-space:nowrap}
.t3{margin-top:6px;font-size:45px;font-weight:900;letter-spacing:1px;color:#14212E;white-space:nowrap}

/* 점선 구분선 - 위쪽 제목 영역과 아래쪽 내용 영역을 갈라 준다 */
.dash{margin-top:32px;border-top:3px dashed #DCE4EB}

/* ── 3) 핵심 안내 문구 ───────────────────────────────────────────────────── */
/*    금액만 <b>로 감싸 블루로 강조한다. */
.lead{margin-top:30px;font-size:19px;font-weight:600;line-height:1.85;color:#3B4956}
.lead b{font-weight:800;color:#1668B0}

/* ── 4) 리워드 3단 ───────────────────────────────────────────────────────── */
/*    카드를 따로 띄우지 않고 테두리 하나에 세로 구분선으로 나눠 담백하게. */
.rw{margin-top:28px;display:flex;border:1.5px solid #E6EDF3;border-radius:16px;overflow:hidden}
.c{flex:1;padding:20px 8px 18px}
.c+.c{border-left:1.5px solid #E6EDF3}
.c .k{font-size:12.5px;font-weight:700;color:#93A1AE;white-space:nowrap}   /* 지급 시점 */
.c .v{margin-top:6px;font-size:30px;font-weight:900;color:#1668B0;letter-spacing:-1.2px;white-space:nowrap}
.c .t{margin-top:6px;font-size:12.5px;font-weight:600;color:#697885;white-space:nowrap}  /* 지급 대상 */

/* ── 5) 참여처 안내 ──────────────────────────────────────────────────────── */
/*    리스트는 좌측 정렬이 읽기 좋으므로, inline-block으로 감싼 뒤
      바깥의 text-align:center로 블록 자체만 가운데에 놓는다. */
.q{margin-top:34px;font-size:16px;font-weight:800;color:#14212E}
.list{margin-top:14px;display:inline-block;text-align:left}
.li{font-size:15.5px;font-weight:600;color:#3B4956;line-height:2.05;white-space:nowrap}
.li i{font-style:normal;font-weight:800;color:#1668B0;margin-right:7px}

/* ── 6) 하단 주의사항 ────────────────────────────────────────────────────── */
.note{margin-top:26px;font-size:13px;font-weight:600;color:#A6B3BF;line-height:1.7}
</style>

<div class="page">

  <!-- 상단 -->
  <img class="face" src="assets/model_face.png" alt="">
  <img class="logo" src="assets/logo_trim.png" alt="EGEN AUTO">
  <div class="sub">이젠몰 X 이젠오토몰</div>

  <!-- 제목 -->
  <div class="stars">★★★★★</div>
  <div class="t1">사진 한 장이면</div>
  <div class="t2">후기가 돈이 됩니다</div>
  <div class="t3">REVIEW EVENT</div>

  <div class="dash"></div>

  <!-- 핵심 안내 -->
  <div class="lead">사진 1장 + 세 줄이면 <b>쓰는 즉시 150원</b><br>잘 쓰면 한 건으로 최대 <b>15,150원</b></div>

  <!-- 리워드 3단 -->
  <div class="rw">
    <div class="c"><div class="k">쓰는 즉시</div><div class="v">150원</div><div class="t">남기신 모든 분</div></div>
    <div class="c"><div class="k">매주 금요일</div><div class="v">~5,000원</div><div class="t">14분</div></div>
    <div class="c"><div class="k">매월 첫째 주</div><div class="v">10,000원</div><div class="t">이달의 후기 3분</div></div>
  </div>

  <!-- 참여처 -->
  <div class="q">아래 사이트에 남긴 후기에서 선정합니다</div>
  <div class="list">
    <div class="li"><i>1.</i>자사몰 — 이젠몰 · 이젠오토몰</div>
    <div class="li"><i>2.</i>스마트스토어 — 이젠몰 · 이젠오토몰</div>
    <div class="li"><i>3.</i>네이버페이 — 이젠몰 · 이젠오토몰</div>
  </div>

  <div class="note">*자세한 내용은 맨 아래에 ↓</div>

</div>
